# Seed source registry.
#
# Source discipline: every entry is a legally accessible public source —
# RSS/Atom feeds, official regulator publication pages, P&I club news pages,
# press-release listings. The fetcher respects robots.txt for HTML sources,
# sends an honest User-Agent, stores only headline + short excerpt + link,
# and never authenticates or bypasses paywalls.
#
# fetch_method: rss  -> feed_url is parsed as RSS/Atom
#               html -> url is a public listing page; links + titles only
# authority_rank: 1 = official regulator/legal source
#                 2 = P&I club / classification society / port authority
#                 3 = specialist maritime press
#                 4 = general/commodity press
#                 5 = aggregator

sources:
  # ── 1. Sanctions and regulators ────────────────────────────────────────
  - name: "OFAC Recent Actions"
    slug: ofac-recent-actions
    url: "https://ofac.treasury.gov/recent-actions"
    feed_url: "https://ofac.treasury.gov/recent-actions/rss.xml"
    fetch_method: rss
    category: sanctions
    authority_rank: 1
    country: "United States"

  - name: "US Treasury Press Releases"
    slug: us-treasury-press
    url: "https://home.treasury.gov/news/press-releases"
    feed_url: "https://home.treasury.gov/rss/press-releases"
    fetch_method: rss
    category: sanctions
    authority_rank: 1
    country: "United States"

