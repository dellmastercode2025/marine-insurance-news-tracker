# Generate the Xcode project with: xcodegen generate
name: AIVoiceTaskManager
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ru
targets:
  AIVoiceTaskManager:
    type: application
    platform: iOS
    sources:
      - path: AIVoiceTaskManager
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aivoicetasks
        CODE_SIGN_ENTITLEMENTS: AIVoiceTaskManager/Resources/AIVoiceTaskManager.entitlements
        INFOPLIST_FILE: AIVoiceTaskManager/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
